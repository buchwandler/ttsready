[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ttsready"
version = "0.2.0"
description = "A source-neutral API for preparing text for speech."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Holger Nahrstaedt" }]
keywords = ["tts", "text-to-speech", "spokenform", "speech-preparation", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: General",
]
dependencies = [
  "spokenform>=0.4.6,<1",
  "phrasplit>=0.3.9,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "pytest>=8,<10",
  "ruff>=0.16,<1",
  "twine>=6,<7",
]
lexical = ["lexhint>=0.1.2,<0.3.0"]

[project.urls]
Homepage = "https://github.com/buchwandler/ttsready"
Repository = "https://github.com/buchwandler/ttsready"
Issues = "https://github.com/buchwandler/ttsready/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ttsready*"]

[tool.setuptools.package-data]
ttsready = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["01_ttsready_api_only_detailed_implementation_brief.md"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
