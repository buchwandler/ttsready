[build-system]
requires = ["setuptools>=80", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ttsready"
dynamic = ["version"]
description = "A source-neutral API for preparing text for speech."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Holger Nahrstaedt" }]
keywords = ["tts", "text-to-speech", "spokenform", "speech-preparation", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: General",
]
dependencies = [
  "spokenform>=0.4.5,<0.5",
  "phrasplit>=0.3.9,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "setuptools>=80",
  "setuptools-scm[toml]>=8",
  "pytest>=8,<10",
  "ruff>=0.16,<1",
  "mypy>=1.11",
  "twine>=6,<7",
  "tomli>=2.0.1; python_version < '3.11'",
]
lexical = ["lexhint>=0.1.2,<0.3.0"]

[project.urls]
Homepage = "https://github.com/buchwandler/ttsready"
Repository = "https://github.com/buchwandler/ttsready"
Issues = "https://github.com/buchwandler/ttsready/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ttsready*"]

[tool.setuptools.package-data]
ttsready = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
extend-exclude = [
  "01_ttsready_api_only_detailed_implementation_brief.md",
  "03_ttsready_dynamic_versioning_public_api_implementation_brief-1.md",
]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools_scm]
version_file = "ttsready/_version.py"
fallback_version = "0+unknown"

[tool.mypy]
python_version = "3.10"
packages = ["ttsready"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
