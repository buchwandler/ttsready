# Build and publish a Python package when a GitHub Release is published.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test supported Python and OS matrix
    uses: ./.github/workflows/tests.yml

  verify:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out release with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r docs/requirements.txt

      - name: Compile source and tests
        run: python -m compileall -q ttsready tests

      - name: Run Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run full test suite
        run: python -m pytest

      - name: Build documentation
        run: sphinx-build -W -b html docs docs/_build/html

      - name: Build release distributions
        run: |
          rm -rf dist build *.egg-info
          python -m build

      - name: Check and validate release distributions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m twine check dist/*
          python tools/check_release_artifacts.py

      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/ttsready-release-smoke"
          "$RUNNER_TEMP/ttsready-release-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/ttsready-release-smoke/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ttsready-release-smoke/bin/python" -c "import ttsready; print(ttsready.__version__)"
          "$RUNNER_TEMP/ttsready-release-smoke/bin/python" -c "import sys, ttsready; assert ttsready.__version__ == '0.2.0'; assert not {'ssmd', 'ssmdconvert', 'utterplan', 'typer'} & set(sys.modules)"
          "$RUNNER_TEMP/ttsready-release-smoke/bin/python" -c "from importlib.resources import files; assert files('ttsready').joinpath('py.typed').is_file()"

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-dists
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish verified distributions to PyPI
    needs: [test-matrix, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: verified-release-dists
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
